[project]
name = "mt5-mcp-server"
version = "0.1.0"
description = "MCP server that automates the MetaTrader 5 Strategy Tester (backtest / optimize)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "psutil>=5.9",
    "pydantic>=2.0",
]

[project.scripts]
mt5-mcp-server = "mt5_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mt5_mcp_server"]
